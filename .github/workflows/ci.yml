name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.6.3"

jobs:
  godot-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Run project smoke test
        run: godot --headless --path . --script scripts/ci/smoke.gd

      - name: Run combat authority tests
        run: godot --headless --path . --script scripts/ci/combat_smoke.gd

      - name: Run zombie AI and combat tests
        run: godot --headless --path . --script scripts/ci/zombie_smoke.gd

      - name: Run gore and dismemberment tests
        run: godot --headless --path . --script scripts/ci/gore_smoke.gd

      - name: Validate shell scripts
        run: bash -n scripts/server/run_server.sh scripts/ci/android_runtime_smoke.sh

  docker-server-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build dedicated server container
        run: docker build -f deploy/docker/Dockerfile -t nexora-deadfall-server:ci .

      - name: Boot dedicated server container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f deadfall-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name deadfall-ci nexora-deadfall-server:ci
          sleep 3
          docker logs deadfall-ci 2>&1 | tee /tmp/deadfall-server.log
          grep -q "dedicated server listening on UDP 24560" /tmp/deadfall-server.log
