name: Android Debug Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "src/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6.3"

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p /tmp/export-templates
          unzip -q /tmp/templates.tpz -d /tmp/export-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -R /tmp/export-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configure Android SDK paths for Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --verbose --headless --path . --export-debug "Android Debug" build/android/NEXORA-DEADFALL-debug-unsigned.apk
          test -s build/android/NEXORA-DEADFALL-debug-unsigned.apk

      - name: Sign test APK with ephemeral CI key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore /tmp/deadfall-physical-test.keystore \
            -storepass android \
            -keypass android \
            -alias deadfall-physical-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=NEXORA DEADFALL Physical Test,O=Ghost Developer,C=MX"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks /tmp/deadfall-physical-test.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/android/NEXORA-DEADFALL-phase1.1-test.apk \
            build/android/NEXORA-DEADFALL-debug-unsigned.apk
          "$APKSIGNER" verify --verbose build/android/NEXORA-DEADFALL-phase1.1-test.apk
          test -s build/android/NEXORA-DEADFALL-phase1.1-test.apk
          ls -lh build/android/NEXORA-DEADFALL-phase1.1-test.apk

      - name: Upload APK when artifact storage is available
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-DEADFALL-phase1.1-test-apk
          path: build/android/NEXORA-DEADFALL-phase1.1-test.apk
          if-no-files-found: error

      - name: Publish latest Phase 1.1 test APK as prerelease
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: phase-1.1-android-test
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" \
            build/android/NEXORA-DEADFALL-phase1.1-test.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "NEXORA: DEADFALL Phase 1.1 Android Test" \
            --notes "Installable ARM64 debug build for physical Android validation. This build uses an ephemeral CI test signature; uninstall an older Phase 1.1 test APK first if Android reports a signature mismatch. This is not the production signing key." \
            --prerelease
