name: Android Debug Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "src/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

env:
  GODOT_VERSION: "4.6.3"

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p /tmp/export-templates
          unzip -q /tmp/templates.tpz -d /tmp/export-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -R /tmp/export-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configure Android SDK paths for Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export unsigned debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --verbose --headless --path . --export-debug "Android Debug" build/android/NEXORA-DEADFALL-debug.apk
          test -s build/android/NEXORA-DEADFALL-debug.apk
          ls -lh build/android/NEXORA-DEADFALL-debug.apk

      - name: Upload APK when artifact storage is available
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-DEADFALL-debug-apk
          path: build/android/NEXORA-DEADFALL-debug.apk
          if-no-files-found: error
